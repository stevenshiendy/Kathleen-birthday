<!doctype html>
<html><head><meta charset="utf-8"><title>Kathleen Bar Story</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Caveat:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;padding:40px}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#160d08;color:#f6e7d3}
.blur{position:absolute;inset:-60px;background:url(../us/087.jpg) center/cover;filter:blur(40px) brightness(.45) saturate(1.2)}
.photo{position:absolute;left:0;top:290px;width:1080px;height:1350px;object-fit:cover;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 74%,transparent 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(1100px 1500px at 50% 45%,transparent 55%,rgba(10,5,2,.7) 100%)}
.top{position:absolute;top:250px;width:100%;text-align:center;font-family:Inter,sans-serif;font-size:32px;letter-spacing:.45em;text-transform:uppercase;color:#f2b56b}
.top:before,.top:after{content:"";display:inline-block;width:70px;height:2px;background:#f2b56b;vertical-align:middle;margin:0 26px;opacity:.7}
.hb{position:absolute;top:1330px;width:100%;text-align:center;font-family:"Playfair Display",serif;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hb .a{font-size:150px;font-style:italic;font-weight:400;line-height:1}
.hb .b{font-size:84px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.name{position:absolute;top:1550px;width:100%;text-align:center;font-family:Caveat,cursive;font-size:140px;color:#f2b56b;transform:rotate(-3deg);text-shadow:0 6px 30px rgba(0,0,0,.6)}
.cheers{position:absolute;top:1730px;width:100%;text-align:center;font-family:Inter,sans-serif;font-size:32px;color:#e8cfb3;opacity:.85;letter-spacing:.06em}
.spark{position:absolute}
</style></head><body>
<section class="s" id="s5">
  <div class="blur"></div>
  <img class="photo" src="../us/087.jpg" alt="">
  <div class="vig"></div><div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,rgba(22,13,8,.72) 74%,rgba(22,13,8,.9) 100%)"></div>
  <div class="top">A toast to you</div>
  <div class="hb"><div class="a">Happy</div><div class="b">Birthday</div></div>
  <div class="name">Kathleen</div>
  <div class="cheers">cheers to another year of us ♡</div>
  <svg class="spark" style="left:120px;top:1370px" width="56" height="56" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12c-7 1-11 5-12 12c-1-7-5-11-12-12c7-1 11-5 12-12z" fill="#f2b56b"/></svg>
  <svg class="spark" style="left:905px;top:1300px" width="40" height="40" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12c-7 1-11 5-12 12c-1-7-5-11-12-12c7-1 11-5 12-12z" fill="#f2b56b"/></svg>
  <svg class="spark" style="left:900px;top:1560px" width="48" height="48" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12c-7 1-11 5-12 12c-1-7-5-11-12-12c7-1 11-5 12-12z" fill="#f2b56b"/></svg>
</section>
</body></html>
