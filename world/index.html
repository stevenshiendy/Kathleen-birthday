<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0c">
<title>For Kathleen</title>
<link rel="icon" href="data:,">
<!--
Design notes (antislop R-31, one line each)
- Concept: she walks as Honey Bunny along one path from Bandung to Ireland; every stop is a moment from their chat, and Honey Bear waits at the end with flowers.
- Content: the password chat, the film and every chapter come from story.html (the one-page version), so the words are identical in both.
- World: low-poly, built in code from simple shapes, lit like the film's warm grade (golden sky, amber light).
- Control: hold anywhere (or the Hold to walk button, Space, W, Up) to walk; the path is fixed, so she cannot get lost. Each stop pauses the walk and opens its chapter as a sheet.
- Fallback: no WebGL means story.html opens instead.
-->
<style id="world-css">
:root{--warm:#e6a65f}
html,body{height:100%}
body{overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}

/* film, between the password and the walk */
#filmwrap{position:fixed;inset:0;z-index:40;background:#000;display:none}
#filmwrap.show{display:block}
#filmwrap .film{height:100%}

/* HUD: progress through the dates, the next stop, film and one-page links */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;display:none}
#hud.show{display:block}
.hudcard{pointer-events:auto;max-width:560px;margin:0 auto;background:rgba(18,19,19,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:14px;padding:12px 14px 6px;color:#fff}
.dots{position:relative;display:flex;justify-content:space-between;align-items:center;height:14px;margin:0 2px}
.dots::before,.dots .fill{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;border-radius:1px;background:rgba(255,255,255,.18)}
.dots .fill{right:auto;width:0;background:var(--warm);transition:width .4s}
.dots i{position:relative;width:8px;height:8px;border-radius:50%;background:#3a3b3b;border:1px solid rgba(255,255,255,.25)}
.dots i.on{background:var(--warm);border-color:var(--warm)}
.hudrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.next{font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9);min-width:0}
.next b{font-weight:600;color:#fff}
.hudlinks{display:flex;gap:2px;flex:none}
.hudlinks a,.hudlinks button{display:inline-flex;align-items:center;height:44px;padding:0 10px;font-size:14px;color:var(--warm);text-decoration:none;border-radius:10px}
@media (max-width:480px){ .hudrow{flex-wrap:wrap;gap:0} .next{width:100%;margin-top:6px} .hudlinks{margin-left:-10px} }
.hudlinks a:hover,.hudlinks button:hover{background:rgba(255,255,255,.08)}

/* hold to walk */
#walk{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);display:none;height:54px;padding:0 26px;border-radius:27px;background:var(--warm);color:#1d1307;font-size:17px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#walk.show{display:block}
#walk.held{transform:translateX(-50%) scale(.97)}
#end{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);display:none;white-space:nowrap;align-items:center;height:54px;padding:0 26px;border-radius:27px;background:rgba(18,19,19,.85);color:#fff;font-size:16px;text-decoration:none}
#end.show{display:inline-flex}

/* a stop's chapter */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:88svh;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.4);transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
#sheet.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
#sheet .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 20px;border-bottom:1px solid var(--line)}
#sheet .bar span{font-size:15px;font-weight:500;color:var(--warm)}
#sheet .bar button{height:44px;padding:0 18px;border-radius:22px;background:var(--warm);color:#1d1307;font-size:15px;font-weight:600}
#sheet .body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(40px,env(safe-area-inset-bottom))}
#sheet .chapter{padding-top:28px}
#sheet .chapter>.when:first-child{display:none}
#sheet .chapter>.when:first-child+*{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 12px;max-width:760px;margin-left:auto;margin-right:auto}
.pgrid img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:#1c1e1e}
@media (min-width:860px){#sheet{left:50%;right:auto;width:780px;margin-left:-390px}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.7);font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#0b0c0c;z-index:60}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<p id="loading">Loading</p>
<canvas id="c" aria-label="Honey Bunny's walk from Bandung to Ireland" role="img"></canvas>
<div id="filmwrap"></div>

<div id="hud" role="region" aria-label="Your walk">
  <div class="hudcard">
    <div class="dots" id="dots" aria-hidden="true"><span class="fill" id="fill"></span></div>
    <div class="hudrow">
      <p class="next" id="next" aria-live="polite"></p>
      <div class="hudlinks"><button type="button" id="mus" aria-pressed="true">Music on</button><button type="button" id="refilm">Film</button><a href="story.html">One page</a></div>
    </div>
  </div>
</div>
<button id="walk" type="button">Hold to walk</button>
<a id="end" href="story.html">Read it all as one page</a>

<section id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
  <div class="bar"><span id="sheet-title"></span><button type="button" id="sheet-close">Keep walking</button></div>
  <div class="body" id="sheet-body"></div>
</section>

<script type="module">
import * as THREE from './lib/three.module.min.js';

const $=s=>document.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const toggle=m=>{ if(m.paused){ const p=m.play(); if(p) p.catch(()=>{}); } else m.pause(); };
const blocked=e=>e&&e.name==='NotAllowedError';
const ICON={
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>',
  soundOn:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
  soundOff:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'
};

// no WebGL: the one-page version
const canvas=$('#c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }catch(_){ location.replace('story.html'); throw new Error('no webgl'); }

// ---------- the story page supplies styles, gate, film and chapters ----------
const doc=new DOMParser().parseFromString(await (await fetch('story.html')).text(),'text/html');
const st=document.createElement('style'); st.textContent=doc.querySelector('style').textContent; document.head.insertBefore(st,$('#world-css'));
const gate=document.importNode(doc.querySelector('#gate'),true); document.body.appendChild(gate);
const filmSec=document.importNode(doc.querySelector('.film'),true); $('#filmwrap').appendChild(filmSec);
const chapters={}; $$('article.chapter',doc).forEach(a=>{ chapters[a.id||a.getAttribute('aria-labelledby')]=a; });
$('#loading').remove();

// clocks
const fmt=tz=>new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:tz}).format(new Date()).replace(':','.');
const hm=tz=>{ const [h,m]=fmt(tz).split('.').map(Number); return {h,m}; };
function clocks(root=document){ const ie=fmt('Europe/Dublin'), id=fmt('Asia/Jakarta');
  const tx=(e,v)=>e.textContent=e.closest('.clocks')?v.replace('.',':'):v;
  $$('.t-ie',root).forEach(e=>tx(e,ie)); $$('.t-id',root).forEach(e=>tx(e,id)); }
$$('.t-now').forEach(e=>e.textContent=fmt('Europe/Dublin')); clocks(); setInterval(()=>clocks(),15000);

function group(root){ const kids=Array.from(root.children);
  kids.forEach((el,i)=>{ if(!el.classList.contains('m')) return; const side=el.classList.contains('out')?'out':'in';
    const same=x=>x&&x.classList.contains('m')&&x.classList.contains(side);
    el.classList.toggle('first',!same(kids[i-1])); el.classList.toggle('last',!same(kids[i+1])); }); }
$$('.thread',gate).forEach(group);

// the real WhatsApp sound
let actx=null, buf=null;
function audioInit(){ try{ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)();
  fetch('audio/wa.m4a').then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(d=>{buf=d;}).catch(()=>{}); }
  if(actx.state==='suspended') actx.resume(); }catch(_){} }
function ding(gain){ if(!actx||!buf||actx.state!=='running') return;
  const s=actx.createBufferSource(), g=actx.createGain(); g.gain.value=gain; s.buffer=buf; s.connect(g).connect(actx.destination); s.start(); }
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,audioInit,{passive:true}));
// ---------- the world's own music: a music box over warm chords, written in code ----------
const music=(()=>{ let out=null, del=null, timer=null, next=0, step=0, on=true, want=false, level=0;
  const BEAT=60/72, hz=m=>440*Math.pow(2,(m-69)/12);
  const CH=[[41,53,57,60],[38,50,53,57],[34,46,50,53],[36,48,52,55]]; // F, Dm, Bb, C
  const MEL=[77,null,74,72, 74,null,null,69, 72,74,77,null, 79,77,74,null, 81,null,79,77, 74,null,72,null, 74,72,69,null, 72,null,null,null];
  function setup(){ out=actx.createGain(); out.gain.value=0; const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; out.connect(lp).connect(actx.destination);
    del=actx.createDelay(1); del.delayTime.value=BEAT*.75; const fb=actx.createGain(); fb.gain.value=.32; const wet=actx.createGain(); wet.gain.value=.35; del.connect(fb).connect(del); del.connect(wet).connect(out); }
  function pad(notes,t){ const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850; f.connect(out); const len=BEAT*4;
    notes.forEach((n,i)=>[0,6].forEach(cents=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=hz(n); o.detune.value=cents;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(i===0?.07:.045,t+1.2); g.gain.setValueAtTime(i===0?.07:.045,t+len-.2); g.gain.linearRampToValueAtTime(0,t+len+1);
      o.connect(g).connect(f); o.start(t); o.stop(t+len+1.1); })); }
  function bell(n,t){ [[1,.16],[2,.05],[3,.018]].forEach(([k,v])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=hz(n)*k;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+1.8/k);
    o.connect(g); g.connect(out); g.connect(del); o.start(t); o.stop(t+1.9); }); }
  function tick(){ while(next<actx.currentTime+.4){ if(step%4===0) pad(CH[(step/4)%4],next); const m=MEL[step]; if(m) bell(m,next); next+=BEAT; step=(step+1)%MEL.length; } }
  function fade(v){ level=v; if(out) out.gain.setTargetAtTime(on?v:0,actx.currentTime,.4); }
  return {
    start(){ want=true; if(!actx||actx.state!=='running') return; if(!out) setup(); if(!timer){ next=actx.currentTime+.1; timer=setInterval(tick,100); } fade(.5); },
    duck(){ fade(0); }, up(){ if(want) this.start(); },
    toggle(){ on=!on; fade(level||.5); return on; },
    retry(){ if(want&&!timer) this.start(); }
  }; })();
addEventListener('pointerdown',()=>setTimeout(()=>music.retry(),50),{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) music.duck(); else if(open<0&&entered&&!filmwrap.classList.contains('show')) music.up(); });

let current=null; const claim=m=>{ if(current&&current!==m&&!current.paused) current.pause(); current=m; };

// ---------- film ----------
const filmwrap=$('#filmwrap'), film=$('#film'), bp=$('#b-play'), bs=$('#b-sound'), cue=$('#cue');
function syncFilm(){ bp.innerHTML=film.paused?ICON.play:ICON.pause; bp.setAttribute('aria-label',film.paused?'Play film':'Pause film');
  bs.innerHTML=film.muted?ICON.soundOff:ICON.soundOn; bs.setAttribute('aria-label',film.muted?'Turn film sound on':'Mute film'); }
['play','pause','ended','volumechange'].forEach(e=>film.addEventListener(e,syncFilm));
film.addEventListener('play',()=>claim(film));
bp.onclick=()=>toggle(film); bs.onclick=()=>{ film.muted=!film.muted; }; film.onclick=()=>toggle(film);
cue.textContent='Skip the film'; cue.setAttribute('href','#'); cue.classList.add('lit');
cue.onclick=e=>{ e.preventDefault(); enterWorld(); };
film.addEventListener('ended',()=>enterWorld());
syncFilm();
function startFilm(withSound){ film.muted=!withSound; film.play().catch(e=>{ if(!blocked(e)) return; film.muted=true; film.play().catch(()=>{}); }); }
$('#mus').onclick=()=>{ const on=music.toggle(); $('#mus').textContent=on?'Music on':'Music off'; $('#mus').setAttribute('aria-pressed',on); };
$('#refilm').onclick=()=>{ holding=false; music.duck(); filmwrap.classList.add('show'); hudShow(false); film.currentTime=0; startFilm(true); };

// ---------- gate ----------
const form=$('#gate-form'), pw=$('#pw'), gt=$('#gate-thread');
const ok=v=>['16september','september16','16sept','sept16','16sep','sep16','1609','0916','16092026','160926','16september2026','16sep2026'].includes(v.toLowerCase().replace(/(st|nd|rd|th)\b/g,'').replace(/[^a-z0-9]/g,''));
const replies=['bukan sayang, coba lagi','hint: the day of the roses','september, sayang'];
let tries=0;
function bubble(side,text){ const d=document.createElement('div'); d.className='m '+side+' shown';
  d.innerHTML='<p></p><time></time>'; d.querySelector('p').textContent=text; d.querySelector('time').textContent=fmt('Europe/Dublin');
  gt.appendChild(d); group(gt); gt.scrollTop=gt.scrollHeight; return d; }
async function reply(text){ const d=bubble('in',text); d.classList.add('typing'); d.setAttribute('aria-hidden','true'); gt.scrollTop=gt.scrollHeight;
  await wait(900); d.classList.remove('typing'); d.removeAttribute('aria-hidden'); ding(.55); }
form.addEventListener('submit',async e=>{
  e.preventDefault(); const v=pw.value.trim(); if(!v) return;
  audioInit(); bubble('out',v); ding(.3); pw.value='';
  if(ok(v)){
    try{sessionStorage.setItem('kb','1')}catch(_){}
    film.muted=false; film.play().then(()=>{ film.pause(); film.currentTime=0; }).catch(()=>{});
    await reply('yes. happy birthday sayang');
    await wait(700); filmwrap.classList.add('show'); gate.classList.add('leaving'); startFilm(true); setTimeout(()=>gate.remove(),900);
  } else { await reply(replies[Math.min(tries++,replies.length-1)]); }
});
try{ if(sessionStorage.getItem('kb')==='1'){ gate.remove(); filmwrap.classList.add('show'); startFilm(false); } }catch(_){}
if(document.body.contains(gate)) pw.focus({preventScroll:true});

// ---------- the world ----------
const scene=new THREE.Scene();
const SKY=new THREE.Color('#f3d7a8');
scene.background=SKY; scene.fog=new THREE.Fog(SKY,70,230);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const camera=new THREE.PerspectiveCamera(50,1,.5,600);
scene.add(new THREE.HemisphereLight('#fff3dc','#6b5a3a',1.15));
const sun=new THREE.DirectionalLight('#ffd9a0',1.9); sun.position.set(-60,80,40); scene.add(sun);

const mats={}; const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));
const M=(geo,c,x=0,y=0,z=0)=>{ const m=new THREE.Mesh(geo,mat(c)); m.position.set(x,y,z); return m; };
const box=(w,h,d,c,x,y,z)=>M(new THREE.BoxGeometry(w,h,d),c,x,y,z);
const cyl=(rt,rb,h,c,x,y,z,seg=8)=>M(new THREE.CylinderGeometry(rt,rb,h,seg),c,x,y,z);
const ico=(r,c,x,y,z,det=0)=>M(new THREE.IcosahedronGeometry(r,det),c,x,y,z);
const cone=(r,h,c,x,y,z,seg=6)=>M(new THREE.ConeGeometry(r,h,seg),c,x,y,z);
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };

// two islands and the sea between them
const ISL=[{x:0,z:0,r:76,c:'#93b05a'},{x:10,z:-186,r:70,c:'#6f9e4f'}];
const sea=new THREE.Mesh(new THREE.PlaneGeometry(900,900,1,1),new THREE.MeshLambertMaterial({color:'#4f9bb0'}));
sea.rotation.x=-Math.PI/2; sea.position.set(0,-1.2,-90); scene.add(sea);
ISL.forEach(I=>{
  const top=new THREE.CylinderGeometry(I.r,I.r+2,4,28,1); const p=top.attributes.position;
  for(let i=0;i<p.count;i++){ const k=1+(rnd()-.5)*.07; p.setX(i,p.getX(i)*k); p.setZ(i,p.getZ(i)*k); }
  top.computeVertexNormals(); const g=M(top,I.c,I.x,-2,I.z); scene.add(g);
  scene.add(cyl(I.r+6,I.r+8,2,'#e9d3a2',I.x,-1.4,I.z,28));
});
const inside=(x,z)=>Math.max(...ISL.map(I=>I.r-3-Math.hypot(x-I.x,z-I.z)));

// the path, Bandung to Ireland
const pts=[[-45,50],[-15,58],[20,50],[45,30],[50,0],[30,-20],[0,-10],[-30,-15],[-50,-35],[-35,-55],[-8,-64],[0,-88],[6,-112],[12,-130],[36,-150],[46,-180],[27,-206],[-10,-216],[-36,-200],[-22,-180],[2,-182]].map(([x,z])=>new THREE.Vector3(x,0,z));
const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
const L=curve.getLength(), N=900, S=curve.getSpacedPoints(N);
const pathY=(x,z)=>{ const d=inside(x,z); const k=Math.min(1,Math.max(0,(1-d)/3)); return .05+k*.7; };
{ // ribbon: sand on land, planks over the sea
  const pos=[], col=[], idx=[]; const sand=new THREE.Color('#e4c68e'), wood=new THREE.Color('#9b6a3e'), c=new THREE.Color();
  for(let i=0;i<=N;i++){ const p=S[i], t=curve.getTangentAt(i/N), n=new THREE.Vector3(t.z,0,-t.x).normalize(), y=pathY(p.x,p.z)+.02;
    const w=inside(p.x,p.z)>0?1.9:1.6;
    pos.push(p.x+n.x*w,y,p.z+n.z*w, p.x-n.x*w,y,p.z-n.z*w);
    c.copy(inside(p.x,p.z)>0?sand:wood); col.push(c.r,c.g,c.b,c.r,c.g,c.b);
    if(i<N) idx.push(2*i,2*i+1,2*i+2, 2*i+1,2*i+3,2*i+2);
    if(inside(p.x,p.z)<-.5&&i%14===0){ scene.add(cyl(.16,.16,2.2,'#6e4a2a',p.x+n.x*1.7,-.4,p.z+n.z*1.7,5)); scene.add(cyl(.16,.16,2.2,'#6e4a2a',p.x-n.x*1.7,-.4,p.z-n.z*1.7,5)); }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));
}

// labels that always face the camera
function label(text,w=8){ const c=document.createElement('canvas'); c.width=512; c.height=128; const g=c.getContext('2d');
  g.font='600 52px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif'; const tw=Math.min(500,g.measureText(text).width+70);
  g.fillStyle='rgba(18,19,19,.84)'; g.beginPath(); g.roundRect((512-tw)/2,16,tw,96,48); g.fill();
  g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,256,66);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false})); s.scale.set(w,w/4,1); return s; }

// ---------- landmarks, one per stop ----------
const anim=[];
function mkPhone(){ const g=new THREE.Group(); const ph=new THREE.Group(); ph.add(box(3.2,6.4,.45,'#1c1e1e',0,0,0), box(2.8,5.7,.05,'#0d1418',0,.05,.25),
  box(1.3,.55,.06,'#1f6b4f',.55,1.2,.3), box(1.7,.55,.06,'#3a3c3c',-.35,.4,.3)); ph.position.y=4; ph.rotation.x=-.12; g.add(ph, box(1.6,.6,1.2,'#6e4a2a',0,.3,0)); return g; }
// a painted wooden board, for signposts
function board(text,w,h,bg='#a8743f',fg='#fff6e6'){ const c=document.createElement('canvas'); c.width=512; c.height=Math.round(512*h/w); const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,c.width,c.height); x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle';

function scatter(I,count,minr,grove=9){ const out=[]; const centers=[]; for(let k=0;k<Math.ceil(count/7);k++){ const a=rnd()*6.283, r=Math.sqrt(rnd())*(I.r-10); centers.push([I.x+Math.cos(a)*r,I.z+Math.sin(a)*r]); }
  let tries=0; while(out.length<count&&tries++<count*40){ const c=centers[Math.floor(rnd()*centers.length)], a=rnd()*6.283, r=rnd()*grove, x=c[0]+Math.cos(a)*r, z=c[1]+Math.sin(a)*r;

const bHead=new THREE.Group(); bHead.position.set(0,2.35,.75);
bHead.add(ico(.82,fur,0,0,0,1), ico(.09,'#2a2220',-.3,.15,.72), ico(.09,'#2a2220',.3,.15,.72), ico(.08,'#e58a9b',0,-.08,.8), ico(.18,'#f6c9cf',-.45,-.12,.6), ico(.18,'#f6c9cf',.45,-.12,.6));
const ear=x=>{ const e=new THREE.Group(); e.add(cyl(.16,.26,1.5,fur,0,.75,0,6), cyl(.08,.14,1.15,'#f0a8b4',0,.72,.12,6)); e.position.set(x,.6,-.05); e.rotation.z=x>0?-.14:.14; return e; };
const earL=ear(-.32), earR=ear(.32); bHead.add(earL,earR);
bunny.add(bBody,bHead, ico(.36,fur,0,1.1,-1.25,1), ico(.38,fur,-.48,.3,.55,1), ico(.38,fur,.48,.3,.55,1));
scene.add(bunny);

// ---------- walking ----------
let s=0, holding=false, nextStop=0, open=-1, entered=false, last=performance.now(), tAll=0;
const SPEED=8.5;
const dots=$('#dots'); STOPS.forEach(()=>dots.appendChild(document.createElement('i')));
function hud(){ const di=$$('i',dots); di.forEach((d,i)=>d.classList.toggle('on',i<nextStop)); $('#fill').style.width=`calc(${Math.min(1,s/STOPS[STOPS.length-1].d)*100}% - 8px)`;
  $('#next').innerHTML=nextStop<STOPS.length?`Next: <b>${STOPS[nextStop].label}</b> · ${Math.max(0,Math.round(STOPS[nextStop].d-s))} m`:'You reached the end'; }
function hudShow(v){ $('#hud').classList.toggle('show',v); $('#walk').classList.toggle('show',v&&nextStop<STOPS.length); $('#end').classList.toggle('show',v&&nextStop>=STOPS.length); }
function enterWorld(){ if(!filmwrap.classList.contains('show')&&entered) return; film.pause(); filmwrap.classList.remove('show'); entered=true; hudShow(open<0); hud(); last=performance.now(); audioInit(); music.start(); }

const startHold=()=>{ if(open<0&&entered&&nextStop<=STOPS.length){ holding=true; $('#walk').classList.add('held'); } };
const stopHold=()=>{ holding=false; $('#walk').classList.remove('held'); };
canvas.addEventListener('pointerdown',e=>{ startHold(); canvas.setPointerCapture?.(e.pointerId); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,stopHold));
const wb=$('#walk'); wb.addEventListener('pointerdown',e=>{ e.preventDefault(); startHold(); wb.setPointerCapture?.(e.pointerId); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>wb.addEventListener(ev,stopHold));
wb.addEventListener('contextmenu',e=>e.preventDefault()); canvas.addEventListener('contextmenu',e=>e.preventDefault());
const WALKKEYS=['ArrowUp','w','W',' ','Enter'];
addEventListener('keydown',e=>{ if(open>=0||!entered||e.target.closest?.('#sheet,#gate,form')) return; if(WALKKEYS.includes(e.key)){ if(e.key===' '||e.key==='Enter') e.preventDefault(); startHold(); } });
addEventListener('keyup',e=>{ if(WALKKEYS.includes(e.key)) stopHold(); });
addEventListener('blur',stopHold);

// ---------- a stop's chapter in the sheet ----------
const sheet=$('#sheet'), body=$('#sheet-body'), built={};
function photosChapter(){ const a=document.createElement('article'); a.className='chapter';
  a.innerHTML='<h2 class="when">Since July</h2><p class="lift">Every photo of us.</p><div class="pgrid">'+Array.from({length:127},(_,i)=>`<img src="us/${String(i).padStart(3,'0')}.jpg" alt="A photo of Kathleen and Steven" width="900" height="1125" loading="lazy">`).join('')+'</div>'; return a; }
function buildChapter(i){ if(built[i]) return built[i]; const st=STOPS[i];
  const a=st.id==='photos'?photosChapter():document.importNode(chapters[st.id],true); a.removeAttribute('id');
  $$('.thread',a).forEach(group); clocks(a); $$('.t-now',a).forEach(e=>e.textContent=fmt('Europe/Dublin'));
  const ch={a,inited:false,clips:[]}; built[i]=ch; return ch; }
function openStop(i){ stopHold(); open=i; const ch=buildChapter(i); body.replaceChildren(ch.a); body.scrollTop=0;
  $('#sheet-title').textContent=STOPS[i].label; $('#sheet-close').textContent=i===STOPS.length-1?'Close':'Keep walking';
  hudShow(false); music.duck(); sheet.classList.add('open'); setTimeout(()=>$('#sheet-close').focus({preventScroll:true}),460);
  if(!ch.inited){ ch.inited=true; initChats(ch.a); initVoice(ch.a); initClips(ch.a,ch); } else ch.io?.disconnect(), observeClips(ch); }
function closeStop(){ if(open<0) return; const ch=built[open]; $$('video,audio',ch.a).forEach(m=>m.pause()); ch.io?.disconnect(); ch.vn?.forEach(a=>a.pause());
  sheet.classList.remove('open'); open=-1; hudShow(true); hud(); music.up(); $('#c').focus({preventScroll:true}); }
$('#sheet-close').onclick=closeStop;
addEventListener('keydown',e=>{ if(e.key==='Escape'&&open>=0) closeStop(); });

function initChats(scope){ const all=$$('.win .chat .m',scope);
  if(reduce){ all.forEach(m=>m.classList.add('shown')); return; }
  all.forEach(m=>m.classList.add('wait')); const queue=[]; let busy=false;
  const onScreen=m=>{ const r=m.getBoundingClientRect(), rr=body.getBoundingClientRect(); return sheet.classList.contains('open')&&r.bottom>rr.top&&r.top<rr.bottom; };
  async function show(m){ if(!onScreen(m)){ m.classList.replace('wait','shown'); return; }
    if(m.classList.contains('in')){ m.classList.add('typing'); m.classList.replace('wait','shown'); await wait(700); m.classList.remove('typing'); ding(.5); await wait(320); }
    else { await wait(380); m.classList.replace('wait','shown'); ding(.28); await wait(260); } }
  async function run(){ if(busy) return; busy=true; while(queue.length) await show(queue.shift()); busy=false; }
  const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(!en.isIntersecting) return;
    const left=$$('.m.wait',en.target.closest('.chat')).filter(m=>!m.dataset.q); for(const m of left){ m.dataset.q='1'; io.unobserve(m); queue.push(m); if(m===en.target) break; } }); run(); },
    {root:body,rootMargin:'0px 0px -12% 0px'});
  all.forEach(m=>io.observe(m)); }

let soundOK=true;
function initClips(scope,ch){ $$('[data-clip]',scope).forEach(fig=>{ const v=fig.querySelector('video'), b=fig.querySelector('.snd');
    const pp=document.createElement('button'); pp.type='button'; pp.className='pp'; b.before(pp);
    const sync=()=>{ b.innerHTML=v.muted?ICON.soundOff:ICON.soundOn; b.setAttribute('aria-label',v.muted?'Turn sound on':'Mute'); pp.innerHTML=v.paused?ICON.play:ICON.pause; pp.setAttribute('aria-label',v.paused?'Play video':'Pause video'); };
    ['volumechange','play','pause'].forEach(e=>v.addEventListener(e,sync)); v.addEventListener('play',()=>claim(v)); v.addEventListener('error',()=>fig.classList.add('failed'));
    pp.onclick=()=>toggle(v); b.onclick=()=>{ v.muted=!v.muted; if(!v.muted){ soundOK=true; v.play().catch(()=>{}); } }; v.onclick=()=>toggle(v); sync(); });
  observeClips(ch); }
function observeClips(ch){ if(reduce) return; ch.io=new IntersectionObserver(es=>es.forEach(en=>{ const v=en.target.querySelector('video');
    if(en.isIntersecting&&open>=0){ v.currentTime=0; v.muted=!soundOK; v.play().catch(e=>{ if(!blocked(e)) return; v.muted=true; soundOK=false; v.play().catch(()=>{}); }); } else if(!v.paused) v.pause(); }),{root:body,threshold:.6});
  $$('[data-clip]',ch.a).forEach(f=>ch.io.observe(f)); }

function initVoice(scope){ $$('.vn',scope).forEach(el=>{ const bars=el.dataset.bars.split(',').map(Number), dur=+el.dataset.dur, t=el.querySelector('time');
    const len=Math.round(dur), lab=`0:${String(len).padStart(2,'0')}`;
    el.insertAdjacentHTML('afterbegin',`<div class="vn-row"><button class="vn-play" type="button" aria-label="Play voice note, ${len} seconds">${ICON.play}</button><div class="wave" aria-hidden="true">${bars.map(b=>`<i style="height:${Math.round(6+b*26)}px"></i>`).join('')}</div><span class="vn-av"><img src="p/s10.jpg" alt="" width="44" height="44"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#144d37"/><rect x="7.5" y="4" width="5" height="8" rx="2.5" fill="#53bdeb"/><path d="M5.5 9.5a4.5 4.5 0 0 0 9 0M10 14v2" stroke="#53bdeb" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span></div><div class="vn-meta"><span class="el">${lab}</span></div>`);
    el.querySelector('.vn-meta').appendChild(t); const btn=el.querySelector('.vn-play'), is=el.querySelectorAll('.wave i'), el2=el.querySelector('.el'); let a=null;
    btn.onclick=()=>{ if(!a){ a=new Audio(el.dataset.src); a.preload='auto'; (built[open].vn||(built[open].vn=[])).push(a);
        a.addEventListener('play',()=>{ claim(a); btn.innerHTML=ICON.pause; btn.setAttribute('aria-label','Pause voice note'); });
        a.addEventListener('pause',()=>{ btn.innerHTML=ICON.play; btn.setAttribute('aria-label',`Play voice note, ${len} seconds`); });
        a.addEventListener('timeupdate',()=>{ const p=a.currentTime/(a.duration||dur); is.forEach((x,i)=>x.classList.toggle('on',i/is.length<p)); el2.textContent=`0:${String(Math.floor(a.currentTime)).padStart(2,'0')}`; });
        a.addEventListener('ended',()=>{ is.forEach(x=>x.classList.remove('on')); el2.textContent=lab; });
        a.addEventListener('error',()=>{ el2.textContent="couldn't load"; }); }
      if(a.paused){ audioInit(); a.play().catch(()=>{ el2.textContent='tap again'; }); } else a.pause(); }; }); }

// ---------- frame loop ----------
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), tmp=new THREE.Vector3();
function place(first){ const u=Math.min(.9999,s/L), p=curve.getPointAt(u), t=curve.getTangentAt(u);
  bunny.position.set(p.x,pathY(p.x,p.z),p.z); bunny.rotation.y=Math.atan2(t.x,t.z);
  const wide=innerWidth<innerHeight; const back=wide?17:14, up=wide?12:9.5;
  tmp.set(p.x-t.x*back,bunny.position.y+up,p.z-t.z*back); const look=new THREE.Vector3(p.x+t.x*6,bunny.position.y+1.6,p.z+t.z*6);
  if(nextStop>=STOPS.length&&open<0){ // the end: she turns to Honey Bear, and the camera frames them both
    const bear=STOPS[STOPS.length-1].at, mid=new THREE.Vector3((p.x+bear.x)/2,1.8,(p.z+bear.z)/2), d=new THREE.Vector3(bear.x-p.x,0,bear.z-p.z);
    bunny.rotation.y=Math.atan2(d.x,d.z); STOPS[STOPS.length-1].sprite.visible=false; const side=new THREE.Vector3(-d.z,0,d.x).normalize(), far=wide?16:12;
    if(side.dot(new THREE.Vector3(-t.x,0,-t.z))<0) side.negate();
    tmp.copy(mid).addScaledVector(side,far).add(new THREE.Vector3(0,wide?5:4,0)); look.copy(mid); }
  const k=first?1:1-Math.exp(-dtG*2.6); camPos.lerp(tmp,k); camLook.lerp(look,k); if(first){ camPos.copy(tmp); camLook.copy(look); } camera.position.copy(camPos); camera.lookAt(camLook); }
let dtG=0;
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?62:50; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); place(true);
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000); last=now; dtG=dt; tAll+=dt;
  if(!entered||filmwrap.classList.contains('show')) return;
  const moving=holding&&open<0&&nextStop<=STOPS.length;
  if(moving){ s=Math.min(L-.5,s+SPEED*dt);
    if(nextStop<STOPS.length&&s>=STOPS[nextStop].d){ s=STOPS[nextStop].d; const i=nextStop; nextStop++; openStop(i); } hud(); }
  place(false);
  const step=moving?Math.abs(Math.sin(tAll*11)):0;
  bBody.position.y=1.25+step*.35; bHead.position.y=2.35+step*.35+Math.sin(tAll*2)*.03; bunny.children.slice(3).forEach((f,i)=>{ if(i>0) f.position.z=.55+(moving?Math.sin(tAll*11+i*3)*.25:0); });
  earL.rotation.x=(moving?-.25:0)+Math.sin(tAll*(moving?11:2))*.08; earR.rotation.x=earL.rotation.x;
  anim.forEach(f=>f(tAll)); clouds.forEach((c,i)=>{ c.position.x+=dt*(1+i%3*.4); if(c.position.x>140) c.position.x=-140; });
  if(Math.floor(tAll*2)!==Math.floor((tAll-dt)*2)) hands.forEach(({tz,hh,mh})=>{ const {h,m}=hm(tz); hh.rotation.z=-((h%12)+m/60)/12*Math.PI*2; mh.rotation.z=-m/60*Math.PI*2; });
  renderer.render(scene,camera); }
hands.forEach(({tz,hh,mh})=>{ const {h,m}=hm(tz); hh.rotation.z=-((h%12)+m/60)/12*Math.PI*2; mh.rotation.z=-m/60*Math.PI*2; });
renderer.render(scene,camera); requestAnimationFrame(frame);
</script>
</body>
